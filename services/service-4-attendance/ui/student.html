<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniTrack – Étudiant</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div id="root"></div><script src="app.js"></script><script>
requireRole("ETUDIANT");
document.getElementById("root").innerHTML = head("Étudiant") + `
<h5>Séance en cours</h5><div id="current" class="mb-4"></div>
<h5>Mes alertes</h5><div id="alerts" class="mb-4"></div>
<h5>Mon assiduité</h5><table class="table table-sm"><thead><tr><th>Module</th><th>Présences</th><th>Absences</th><th>Taux</th><th>Niveau</th></tr></thead><tbody id="mods"></tbody></table></div>`;
async function load(){
  const cur = await api("/seances/current/");
  document.getElementById("current").innerHTML = cur.length ? cur.map(s => `<div class="card card-body mb-2"><b>${s.module_intitule}</b> · ${s.heure_debut.slice(0,5)}–${s.heure_fin.slice(0,5)} · ${s.salle_nom}
    <div class="input-group mt-2"><input id="c${s.id}" class="form-control form-control-lg text-center" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres">
    <button class="btn btn-primary" onclick="checkin(${s.id})">Valider ma présence</button></div></div>`).join("") : "<p class='text-muted'>Aucune séance ouverte pour votre groupe.</p>";
  const a = await api("/me/alerts/");
  document.getElementById("alerts").innerHTML = a.alertes.length ? a.alertes.map(m => `<div class="alert alert-${LEVEL[m.niveau_alerte]}">${m.module_intitule} : ${m.absents} absence(s)</div>`).join("") : "<p class='text-muted'>Aucune alerte.</p>";
  const s = await api("/me/attendance/");
  document.getElementById("mods").innerHTML = s.modules.map(m => `<tr><td>${m.module_intitule}</td><td>${m.presents}</td><td>${m.absents}</td><td>${m.taux_assiduite}%</td><td><span class="badge bg-${LEVEL[m.niveau_alerte]}">${m.niveau_alerte}</span></td></tr>`).join("");
}
function getPos(){ return new Promise(res => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res({latitude:p.coords.latitude, longitude:p.coords.longitude}), () => res({}), {timeout:4000}) : res({})); }
async function checkin(id){
  try { const pos = await getPos(); const r = await api(`/seances/${id}/check-in/`, {method:"POST", body:{code: document.getElementById("c"+id).value.trim(), ...pos}});
    toast(r.message); load(); } catch(e){ toast(e.message, false); } }
load().catch(e => toast(e.message,false)); setInterval(() => load().catch(()=>{}), 15000);
</script></body></html>
