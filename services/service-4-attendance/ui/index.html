<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniTrack – Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container" style="max-width:520px"><h3 class="my-4">UniTrack – S4 Assiduité</h3>
<div id="msg" class="alert alert-danger d-none"></div>
<div class="card card-body mb-3"><label class="form-label">URL de la passerelle (Traefik)</label>
<input id="base" class="form-control mb-2" value="http://localhost">
<h6>Connexion via S1 (Auth)</h6>
<input id="email" class="form-control mb-2" placeholder="email"><input id="pwd" type="password" class="form-control mb-2" placeholder="mot de passe">
<button class="btn btn-primary" onclick="login()">Se connecter</button></div>
<div class="card card-body"><h6>Ou coller un JWT (mode développement)</h6>
<textarea id="tok" class="form-control mb-2" rows="3" placeholder="python manage.py dev_token --role ETUDIANT --sub student-1"></textarea>
<button class="btn btn-outline-primary" onclick="useToken()">Utiliser ce token</button></div></div>
<script src="app.js"></script><script>
const PAGES = {ENSEIGNANT:"teacher.html", ETUDIANT:"student.html", ADMIN:"admin.html", SUPERVISEUR:"admin.html"};
document.getElementById("base").value = store.base;
function go(){ const r = role(); if(PAGES[r]) location.href = PAGES[r]; else { const m=document.getElementById("msg"); m.textContent="Token invalide ou rôle inconnu"; m.classList.remove("d-none"); } }
function useToken(){ localStorage.setItem("base", base.value); localStorage.setItem("token", tok.value.trim()); go(); }
async function login(){
  localStorage.setItem("base", base.value);
  try { const r = await fetch(base.value + "/api/auth/login/", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: email.value, password: pwd.value})});
    const d = await r.json(); if(!r.ok) throw new Error(d.detail || "Échec de connexion");
    localStorage.setItem("token", d.access || d.token); go(); }
  catch(e){ const m=document.getElementById("msg"); m.textContent=e.message; m.classList.remove("d-none"); } }
</script></body></html>
