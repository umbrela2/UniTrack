<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniTrack – Administration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div id="root"></div><script src="app.js"></script><script>
requireRole("ADMIN","SUPERVISEUR");
const isAdmin = role()==="ADMIN";
document.getElementById("root").innerHTML = head(isAdmin ? "Administrateur" : "Superviseur") + `
<div id="dash" class="row mb-3"></div>
<h5>Séances non assurées</h5><table class="table table-sm mb-4"><thead><tr><th>Date</th><th>Module</th><th>Enseignant</th><th>Groupe</th></tr></thead><tbody id="na"></tbody></table>
<h5>Historique d'assiduité</h5>
<div class="row g-2 mb-2"><div class="col"><input id="f_group" class="form-control" placeholder="Groupe"></div><div class="col"><input id="f_module" class="form-control" placeholder="Module"></div>
<div class="col"><input id="f_ens" class="form-control" placeholder="Enseignant"></div><div class="col"><input id="f_from" type="date" class="form-control"></div>
<div class="col"><input id="f_to" type="date" class="form-control"></div><div class="col-auto"><button class="btn btn-primary" onclick="hist()">Filtrer</button></div></div>
<table class="table table-sm"><thead><tr><th>Date</th><th>Module</th><th>Étudiant</th><th>Statut</th><th>Mode</th></tr></thead><tbody id="h"></tbody></table>
${isAdmin ? `<h5 class="mt-4">Paramètres</h5><form class="row g-2" onsubmit="saveCfg(event)" id="cfg"></form>` : ""}</div>`;
const F = {code_validity_minutes:"Validité du code (min)", threshold_warning:"Seuil orange", threshold_critical:"Seuil rouge", geo_radius_m:"Rayon (m)", geo_latitude:"Latitude", geo_longitude:"Longitude"};
async function load(){
  const d = await api("/dashboard/");
  dash.innerHTML = [["Séances aujourd'hui", d.seances_aujourdhui],["Non assurées (30 j)", d.seances_non_assurees],["Taux d'assiduité", d.presences.taux_assiduite==null?"–":d.presences.taux_assiduite+" %"]]
    .map(([k,v]) => `<div class="col"><div class="card card-body text-center"><div class="text-muted">${k}</div><div class="fs-3 fw-bold">${v}</div></div></div>`).join("");
  const na = await api("/seances/non-assurees/");
  document.getElementById("na").innerHTML = na.results.map(s => `<tr><td>${s.date_seance}</td><td>${s.module_intitule}</td><td>${s.enseignant_nom||s.enseignant_id}</td><td>${s.group_label}</td></tr>`).join("") || "<tr><td colspan=4 class='text-muted'>Aucune</td></tr>";
  hist();
  if (isAdmin) { const c = await api("/settings/"); cfg.innerHTML = Object.entries(F).map(([k,l]) => `<div class="col-md-4"><label class="form-label">${l}</label><input class="form-control" name="${k}" value="${c[k]??""}"></div>`).join("") +
    `<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="geo_check_enabled" ${c.geo_check_enabled?"checked":""}><label class="form-check-label">Vérifier la position (RG15)</label></div></div><div class="col-12"><button class="btn btn-success">Enregistrer</button></div>`; }
}
async function hist(){
  const q = new URLSearchParams(); [["group_id",f_group],["module_id",f_module],["enseignant_id",f_ens],["date_from",f_from],["date_to",f_to]].forEach(([k,e]) => e.value && q.set(k,e.value));
  const r = await api("/history/?"+q);
  document.getElementById("h").innerHTML = r.results.map(p => `<tr><td>${p.date_seance}</td><td>${p.module_intitule}</td><td>${p.student_nom||p.student_id}</td><td><span class="badge bg-${p.statut==="PRESENT"?"success":"danger"}">${p.statut}</span></td><td>${p.mode}</td></tr>`).join("");
}
async function saveCfg(e){ e.preventDefault(); const b = {}; new FormData(cfg).forEach((v,k) => b[k] = v===""? null : (isNaN(v)? v : Number(v))); b.geo_check_enabled = cfg.elements.geo_check_enabled.checked;
  try { await api("/settings/", {method:"PUT", body:b}); toast("Paramètres enregistrés"); } catch(err){ toast(err.message,false); } }
load().catch(e => toast(e.message,false));
</script></body></html>
